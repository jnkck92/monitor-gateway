server:
  port: 8082

spring:
  application:
    name: monitor-gateway
  cloud:
    gateway:
      server:
        webflux:
          metrics:
            enabled: true
          httpclient:
            connect-timeout: 2000
            response-timeout: 5s
          routes:
            - id: backend
              uri: http://backend:8080
              predicates:
                - Path=/api/v1/monitor/**
                - Method=GET
            - id: news
              uri: http://backend:8080
              predicates:
                - Path=/api/v1/{slug}/news
            - id: events
              uri: http://backend:8080
              predicates:
                - Path=/api/v1/{slug}/events

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus, metrics
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: ${spring.application.name}
  prometheus:
    metrics:
      export:
        enabled: true

filter:
  allowed-paths:
    - status
    - news
    - events
  slug:
    valid: "^[a-f0-9]{64}$"
    pattern: "^/api/v1/monitor/([^/]+)/(.*)$"
    api-pattern: "^/api/v1/([^/]+)/(news|events)$"
  vehicle:
    param-name: "vehicle"
    pattern: "^[A-Za-z0-9_-]{1,32}$"