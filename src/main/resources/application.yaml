server:
  port: 8082

spring:
  cloud:
    gateway:
      server:
        webflux:
          metrics:
            enabled: true
          httpclient:
            connect-timeout: 2000
            response-timeout: 5s
          routes:
            - id: backend
              uri: http://backend:8080
              predicates:
                - Path=/api/v1/monitor/**
                - Method=GET

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus, metrics
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: monitor-backend
  prometheus:
    metrics:
      export:
        enabled: true

filter:
  allowed-paths:
    - status
  slug:
    valid: "^[a-f0-9]{64}$"
    pattern: "^/api/v1/monitor/([^/]+)/(.*)$"
  vehicle:
    param-name: "vehicle"
    pattern: "^[A-Za-z0-9_-]{1,32}$"